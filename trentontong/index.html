    <script>
      // Apply the saved theme (or the system preference) before first paint so dark mode
      // never flashes light. The storage key must match src/hooks/useTheme.js.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
